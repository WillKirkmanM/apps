resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

parson:
  library_name: Parson Storage Test
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30519

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/parson-storage/data
  writable: /opt/tests/mnt/parson-storage/writable
  readonly: /opt/tests/mnt/parson-storage/readonly

storage:
  data:
    type: ix_volume
    ix_volume_config:
      create_host_path: true
      dataset_name: data
  music:
    type: host_path
    host_path_config:
      create_host_path: true
      path: /opt/tests/mnt/parson-storage/music
  additional_storage:
    - type: ix_volume
      read_only: false
      mount_path: /writable
      ix_volume_config:
        create_host_path: true
        dataset_name: writable
    - type: ix_volume
      read_only: true
      mount_path: /readonly
      ix_volume_config:
        create_host_path: true
        dataset_name: readonly
