resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

parson:
  library_name: Parson
  additional_envs: []

network:
  host_network: true
  web_port:
    bind_mode: published
    port_number: 30506

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/parson-host-network/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      create_host_path: true
      dataset_name: data
  music:
    type: host_path
    host_path_config:
      create_host_path: true
      path: /opt/tests/mnt/parson-host-network/music
  additional_storage: []
