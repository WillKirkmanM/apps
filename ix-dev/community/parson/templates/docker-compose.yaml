{% set tpl = ix_lib.base.render.Render(values) %}

{% set parson = tpl.add_container(values.consts.parson_container_name, "image") %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do parson.set_user(values.run_as.user, values.run_as.group) %}
{% do parson.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/health"}) %}

{% do parson.environment.add_env("PARSON_DATA_DIR", values.consts.data_path) %}
{% do parson.environment.add_env("PARSON_PORT", values.network.web_port.port_number) %}
{% do parson.environment.add_env("PARSON_LIBRARY_NAME", values.parson.library_name) %}
{% do parson.environment.add_user_envs(values.parson.additional_envs) %}

{% do parson.add_port(values.network.web_port) %}

{% do parson.add_storage(values.consts.data_path, values.storage.data) %}
{% do perms.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do parson.add_storage(values.consts.music_path, dict(values.storage.music, **{"read_only": true})) %}

{% for store in values.storage.additional_storage %}
  {% do parson.add_storage(store.mount_path, store) %}
  {% do perms.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do parson.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
